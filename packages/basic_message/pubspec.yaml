name: basic_message
description: A structured, type-safe, and compile-time mapping localization framework for Dart, specifically designed for multi-environment projects (Flutter GUI and Dart CLI). It enables "Define Once, Use Everywhere" by decoupling business logic from platform-specific translation implementation.
version: 1.0.1

repository: https://github.com/huanguan1978/messages
issue_tracker: https://github.com/huanguan1978/messages/issues

funding:
  - https://github.com/sponsors/huanguan1978

resolution: workspace
environment:
  sdk: '>=3.5.0 <4.0.0'

executables:
  gen_msg_resource: gen_msg_resource
  gen_msg_registry: gen_msg_registry

topics:
  - i18n
  - intl
  - localization
  - translation
  - language

dependencies:
  logging: ^1.3.0
  dart_style: ^3.1.3
  analyzer: ^8.4.1
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
